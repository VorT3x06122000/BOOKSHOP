_schema-version: 3.3.0
ID: BOOKSHOP
description: A simple CAP project.
version: 1.0.0
modules:
- name: BOOKSHOP-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: BOOKSHOP
  - name: uaa_BOOKSHOP
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    readiness-health-check-http-endpoint: /health
    readiness-health-check-type: http
  build-parameters:
    builder: npm
    ignore:
    - node_modules/
- name: BOOKSHOP-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: BOOKSHOP
  parameters:
    buildpack: nodejs_buildpack
- name: BOOKSHOP-destination-content
  type: com.sap.application.content
  requires:
  - name: BOOKSHOP-destination-service
    parameters:
      content-target: true
  - name: BOOKSHOP_html_repo_host
    parameters:
      service-key:
        name: BOOKSHOP_html_repo_host-key
  - name: uaa_BOOKSHOP
    parameters:
      service-key:
        name: uaa_BOOKSHOP-key
  parameters:
    content:
      instance:
        destinations:
        - Name: bookshop_BOOKSHOP_html_repo_host
          ServiceInstanceName: BOOKSHOP-html5-app-host-service
          ServiceKeyName: BOOKSHOP_html_repo_host-key
          sap.cloud.service: bookshop
        - Authentication: OAuth2UserTokenExchange
          Name: bookshop_uaa_BOOKSHOP-key
          ServiceInstanceName: BOOKSHOP-xsuaa-service
          ServiceKeyName: uaa_BOOKSHOP-key
          sap.cloud.service: bookshop
        existing_destinations_policy: update
  build-parameters:
    no-source: true
- name: BOOKSHOP-app-content
  type: com.sap.application.content
  path: app
  requires:
  - name: BOOKSHOP_html_repo_host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - mybookshopbookshop.zip
      name: mybookshopbookshop
      target-path: resources/
- name: mybookshopbookshop
  type: html5
  path: app/bookshop
  requires:
  - name: uaa_BOOKSHOP
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: BOOKSHOP
  type: com.sap.xs.hdi-container
  parameters:
    config:
      schema: BOOKDB
    service: hana
    service-plan: hdi-shared
- name: BOOKSHOP-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
            Name: bookshop-srv-api
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: BOOKSHOP-destination-service
    service-plan: lite
  requires:
  - name: srv-api
- name: BOOKSHOP_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: BOOKSHOP-html5-app-host-service
    service-plan: app-host
- name: uaa_BOOKSHOP
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-name: BOOKSHOP-xsuaa-service
    service-plan: application
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm install --production
    - npx -p @sap/cds-dk cds build --production
